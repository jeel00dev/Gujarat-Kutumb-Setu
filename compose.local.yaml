# Existing-machine mode: keep all writable project state on this project drive.
# Uses cached base images and bind-mounted builds; no cleanup of other apps.
# docker compose -f compose.yaml -f compose.local.yaml up -d --no-build
services:
  db:
    volumes:
      - ./.local/postgres:/var/lib/postgresql/data

  migrate:
    image: python:3.12-slim
    build: !reset null
    working_dir: /app
    user: "${KUTUMB_UID:-1000}:${KUTUMB_GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_CACHE_DIR: /runtime/cache
    volumes:
      - ./backend:/app:ro
      - ./.local/python:/runtime
      - ./.local/evidence:/app/data/uploads
    command: ["sh", "-c", "python -m venv /runtime/venv && /runtime/venv/bin/pip install -r requirements.lock && /runtime/venv/bin/alembic upgrade head && /runtime/venv/bin/python -m app.seed"]

  api:
    image: python:3.12-slim
    build: !reset null
    working_dir: /app
    user: "${KUTUMB_UID:-1000}:${KUTUMB_GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app:ro
      - ./.local/python:/runtime:ro
      - ./.local/evidence:/app/data/uploads
    command: ["/runtime/venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  worker:
    image: python:3.12-slim
    build: !reset null
    working_dir: /app
    user: "${KUTUMB_UID:-1000}:${KUTUMB_GID:-1000}"
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app:ro
      - ./.local/python:/runtime:ro
      - ./.local/evidence:/app/data/uploads
    command: ["/runtime/venv/bin/python", "-m", "app.worker"]

  web:
    image: nginx:alpine
    build: !reset null
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/nginx-cache:/var/cache/nginx
      - ./.local/nginx-run:/var/run
      - ./.local/nginx-tmp:/tmp
