name: kutumb_setu_demo

x-backend: &backend
  image: kutumb-setu-api:demo
  build:
    context: .
    dockerfile: deploy/Dockerfile.backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kutumb}:${POSTGRES_PASSWORD:-kutumb_demo_password}@db:5432/${POSTGRES_DB:-kutumb}
    DEMO_MODE: ${DEMO_MODE:-true}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8095,http://localhost:8095,http://127.0.0.1:5175,http://localhost:5175}
    IDENTITY_PROVIDER: ${IDENTITY_PROVIDER:-simulated}
    PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulated}
    UPLOAD_DIR: /app/data/uploads
    PYTHONUNBUFFERED: "1"
  volumes:
    - evidence:/app/data/uploads
  security_opt:
    - no-new-privileges:true
  networks:
    - registry

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kutumb}
      POSTGRES_USER: ${POSTGRES_USER:-kutumb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kutumb_demo_password}
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    networks:
      - registry

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: kutumb-setu-web:demo
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8095}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - registry

volumes:
  postgres_data:
  evidence:

networks:
  registry:
